<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FramePilot – Smart Multi‑Camera Editing</title>
    <!-- PicoCSS – lightweight, modern UI components -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Top navigation bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="/" class="logo">Frame<span>Pilot</span></a>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <button id="dark-mode-toggle" class="secondary outline btn-sm" style="margin-left:0.5rem;">🌙</button>
            </div>
        </div>
    </nav>
    <script>
        const toggle = document.getElementById('dark-mode-toggle');
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') {
            document.body.classList.add('dark');
            toggle.textContent = '☀️';
        }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            toggle.textContent = isDark ? '☀️' : '🌙';
        });
    </script>
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Optional footer (can be removed later) -->
    <footer class="container" style="margin-top:4rem; text-align:center; font-size:0.85rem; color:var(--text-muted);">
        © 2026 FramePilot – Built by Ahmed Sameh & team
    </footer>
</body>
</html>
