{% extends "base.html" %}

{% block content %}
<h2>Labelling Tool ({{ project.name }})</h2>
<p>Press 1, 2, 3 to switch cameras. Press H to mark a highlight. Press Save when done.</p>

<div class="grid">
    {% for c in cams %}
    <video id="v{{ c }}" src="/files/{{ sid }}/raw/cam{{ c }}.mp4" muted controls width="100%"></video>
    {% endfor %}
</div>

<button onclick="save()" class="secondary" style="margin-top:20px;">Save Labels</button>

<script>
const vids = [...document.querySelectorAll("video")], master = vids[0];
if(master) {
    master.muted = false; 
    master.controls = true; 
    master.playbackRate = 0.75;
    
    const changes = [], highlights = []; 
    let hStart = null;
    
    master.onplay = () => vids.slice(1).forEach(v => v.play());
    master.onpause = () => vids.slice(1).forEach(v => v.pause());
    
    setInterval(() => vids.slice(1).forEach(v => { 
        v.playbackRate = master.playbackRate;
        if (Math.abs(v.currentTime - master.currentTime) > 0.15) 
            v.currentTime = master.currentTime; 
    }), 500);
    
    document.onkeydown = e => {
        const t = +master.currentTime.toFixed(1);
        if ("1234".includes(e.key)) { 
            changes.push([t, +e.key]); 
            // Highlight border logic omitted for simplicity
        }
        if (e.key.toLowerCase() === "h") {
            if (hStart === null) hStart = t; 
            else { 
                highlights.push([hStart, t, "key_point"]); 
                hStart = null; 
            } 
        }
    };
    
    window.save = async function() {
        await fetch("/api/labels/{{ sid }}", { 
            method: "POST", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                changes: changes, 
                highlights: highlights, 
                duration: master.duration || 600
            }) 
        });
        alert("Saved ✔");
    }
}
</script>
{% endblock %}
