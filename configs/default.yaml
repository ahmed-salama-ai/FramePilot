# Shared settings. Ask Ahmed Salama before changing anything here.

fps: 30          # every synced video is forced to constant 30 fps
step: 0.1        # seconds between rows in features.parquet / scores.parquet / labels.csv

ingest:
  sample_rate: 16000   # audio.wav: 16 kHz mono
  sync_seconds: 60     # search the clap in the first N seconds
  render_height: 720   # video/camN.mp4 (render)
  proxy_width: 640     # video/camN_640.mp4 (perception)

scorer:
  weights: {speaker: 3.0, frontal: 1.0, quality: 0.8, gesture: 0.5, shake: 1.0}
  face_full: 0.15      # face_area at which the speaker term is at full strength

switcher:
  min_shot: 2.0        # rule 1: never cut before 2 s
  margin: 0.2          # challenger must be 20% better
  hold: 0.4            # ... for 0.4 s
  max_shot: 15.0       # rule 3: variety
  low_score: 0.3       # rule 4: all scores low -> wide

audio:
  # Speech-to-text AND who speaks when: Gemini 3.5 Transcribe (Google cloud). Chosen 2026-10-05 after the Colab
  # bake-offs (notebooks/, parts 1-8). It hears the ORIGINAL audio.wav (no filter) and gives every word with its
  # time and speaker -> transcript.json + diarization.json. Silero VAD still makes speech.json; no pyannote.
  asr_model: gemini-3.5-transcribe
  language_codes: {ar: [ar-EG], en: [en-US]}   # [] = the model detects the language itself
  # 0 = the FULL session in one request (max 30 min with speakers + word times; one key at a time, the others
  # only take over when it is busy). 60 = ~1-minute pieces shared between all the keys at the same time.
  chunk_seconds: 0
  cut_search_seconds: 10      # pieces only: each cut goes in the silence nearest to the planned place, +-10 s
  segment_max_seconds: 15     # transcript.json rows: split at a speaker change, a pause > 1 s, or after 15 s
  # Gemini names the speakers of every piece separately -> voice fingerprints join the same voice across pieces
  voice_model: microsoft/wavlm-base-plus-sv
  same_voice: 0.75            # cosine similarity above this = the same person (only matters before num_speakers is reached)
  speaker_model: gemini-3.1-flash-lite   # reads the transcript -> speakers.json (host, guest, ... + names)
  # Keys live in the .env file (never in Git): GEMINI_API_KEY, GEMINI_API_KEY_2, GEMINI_API_KEY_3, ... any number.
  api_key_prefix: GEMINI_API_KEY

ollama:
  text_model: qwen3:8b      # plan B: qwen3:4b
  vision_model: qwen3-vl:4b # plan B: gemma3:4b
  embed_model: bge-m3
